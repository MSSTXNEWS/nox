<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NOX HELION · Главная · Living Demo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#e8e0d0; font-family: system-ui, -apple-system, sans-serif; }
#bg { position:fixed; inset:0; z-index:0; }
#core-layer { position:fixed; inset:0; z-index:1; pointer-events:none; }
.ui { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; }
.topbar {
  height:64px; display:flex; align-items:center; padding:0 24px;
  background:rgba(0,0,0,0.35); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,180,60,0.15);
}
.logo { font-size:20px; letter-spacing:3px; font-weight:600; text-shadow:0 0 12px #ffaa44; }
.logo span { color:#ffaa44; }
.spacer { flex:1; }
.status { font-size:12px; opacity:0.7; }
.main { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
.core-container {
  position:relative; width:280px; height:280px;
  display:flex; align-items:center; justify-content:center;
}
#core-canvas { position:absolute; inset:-40px; }
.core-label {
  position:relative; z-index:3; font-size:22px; letter-spacing:4px;
  text-shadow:0 0 20px #ffcc66, 0 0 40px #ff8800;
  pointer-events:none;
}
.buttons {
  position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
  display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:90%;
}
.btn {
  position:relative; padding:12px 18px; border:none; border-radius:28px;
  background:rgba(20,15,10,0.55); color:#f0e6d0; cursor:pointer;
  backdrop-filter:blur(8px); border:1px solid rgba(255,180,80,0.25);
  font-size:13px; letter-spacing:0.5px; transition:transform 0.2s, box-shadow 0.2s;
  overflow:hidden;
}
.btn::before {
  content:''; position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(135deg, rgba(255,200,80,0.15), transparent 40%, rgba(255,140,40,0.1));
  pointer-events:none; animation:flow 4s linear infinite;
}
@keyframes flow { to { transform:translateX(20px) rotate(2deg); } }
.btn:hover { transform:translateY(-3px) scale(1.04); box-shadow:0 0 24px rgba(255,160,40,0.45); }
.panels {
  position:absolute; top:80px; left:20px; right:20px; display:flex; justify-content:space-between; pointer-events:none;
}
.panel {
  width:220px; padding:16px; border-radius:16px;
  background:rgba(10,8,6,0.45); backdrop-filter:blur(14px);
  border:1px solid rgba(255,180,60,0.12); font-size:12px; line-height:1.5;
}
.panel h4 { margin-bottom:8px; color:#ffcc88; font-weight:500; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="core-layer"></div>
<div class="ui">
  <div class="topbar">
    <div class="logo">NOX <span>HELION</span></div>
    <div class="spacer"></div>
    <div class="status">РЕЗОНАНС · ЖИВОЕ ЯДРО · BLACK LIQUID</div>
  </div>
  <div class="main">
    <div class="panels">
      <div class="panel">
        <h4>СИСТЕМНЫЙ СТАТУС</h4>
        РЕЗОНАНС АКТИВЕН<br>
        ГАРМОНИЯ 98.7%<br>
        ЭНЕРГИЯ ЯДРА 87.3%
      </div>
      <div class="panel">
        <h4>АКТИВНЫЙ РЕЗОНАНС</h4>
        ЧАСТОТА 7.83 Гц<br>
        ФАЗА СИНХРОННА<br>
        ПОТОК ЖИВОЙ
      </div>
    </div>
    <div class="core-container">
      <canvas id="core-canvas" width="360" height="360"></canvas>
      <div class="core-label">РЕЗОНАНС</div>
    </div>
  </div>
  <div class="buttons">
    <button class="btn">РАБОТЫ</button>
    <button class="btn">ИНТЕЛЛЕКТ</button>
    <button class="btn">ЗНАНИЯ</button>
    <button class="btn">ОБУЧЕНИЕ</button>
    <button class="btn">РАЗВЛЕЧЕНИЯ</button>
    <button class="btn">ЛЮДИ</button>
    <button class="btn">ТВОРЧЕСТВО</button>
    <button class="btn">БИЗНЕС</button>
    <button class="btn">МИР</button>
    <button class="btn">ПК</button>
  </div>
</div>
<script>
const bg = document.getElementById('bg');
const bctx = bg.getContext('2d');
function resize() { bg.width = innerWidth; bg.height = innerHeight; }
resize();
addEventListener('resize', resize);
const particles = [];
for (let i = 0; i < 180; i++) {
  particles.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: 40 + Math.random() * 120, vx: (Math.random()-0.5)*0.6, vy: (Math.random()-0.5)*0.6,
    phase: Math.random()*Math.PI*2, speed: 0.3 + Math.random()*0.7
  });
}
function drawBG(t) {
  bctx.fillStyle = 'rgba(2,2,4,0.25)'; bctx.fillRect(0,0,bg.width,bg.height);
  particles.forEach(p => {
    p.x += p.vx + Math.sin(t*0.0003 + p.phase)*0.4;
    p.y += p.vy + Math.cos(t*0.00025 + p.phase)*0.35;
    if (p.x < -p.r) p.x = bg.width + p.r; if (p.x > bg.width + p.r) p.x = -p.r;
    if (p.y < -p.r) p.y = bg.height + p.r; if (p.y > bg.height + p.r) p.y = -p.r;
    const g = bctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, 'rgba(40,30,20,0.55)'); g.addColorStop(0.4, 'rgba(20,15,10,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    bctx.fillStyle = g; bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, Math.PI*2); bctx.fill();
  });
  bctx.globalCompositeOperation = 'lighter'; bctx.fillStyle = 'rgba(180,120,40,0.04)'; bctx.fillRect(0,0,bg.width,bg.height); bctx.globalCompositeOperation = 'source-over';
}
const core = document.getElementById('core-canvas');
const cctx = core.getContext('2d');
function drawCore(t) {
  const w = core.width, h = core.height, cx = w/2, cy = h/2;
  cctx.clearRect(0,0,w,h);
  const pulse = 1 + Math.sin(t*0.003)*0.08; const r = 90 * pulse;
  const og = cctx.createRadialGradient(cx, cy, r*0.3, cx, cy, r*1.8);
  og.addColorStop(0, 'rgba(255,180,60,0.55)'); og.addColorStop(0.5, 'rgba(255,100,20,0.25)'); og.addColorStop(1, 'rgba(0,0,0,0)');
  cctx.fillStyle = og; cctx.beginPath(); cctx.arc(cx,cy,r*1.8,0,Math.PI*2); cctx.fill();
  for (let i = 0; i < 5; i++) {
    const ang = t*0.002 + i*1.2; const rr = r * (0.6 + i*0.12) + Math.sin(t*0.004 + i)*8;
    cctx.beginPath(); cctx.ellipse(cx + Math.cos(ang)*6, cy + Math.sin(ang)*6, rr, rr*0.92, ang*0.3, 0, Math.PI*2);
    cctx.strokeStyle = `rgba(255,${160+i*15},40,${0.35-i*0.05})`; cctx.lineWidth = 2.5 - i*0.3; cctx.stroke();
  }
  const cg = cctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  cg.addColorStop(0, '#fff4cc'); cg.addColorStop(0.3, '#ffaa33'); cg.addColorStop(0.7, '#ff6600'); cg.addColorStop(1, 'rgba(180,40,0,0.6)');
  cctx.fillStyle = cg; cctx.beginPath(); cctx.arc(cx,cy,r*0.55,0,Math.PI*2); cctx.fill();
  cctx.strokeStyle = 'rgba(255,220,140,0.6)'; cctx.lineWidth = 1.2;
  for (let i = 0; i < 8; i++) {
    cctx.beginPath(); const a = t*0.0015 + i * Math.PI/4;
    cctx.moveTo(cx + Math.cos(a)*20, cy + Math.sin(a)*20);
    cctx.quadraticCurveTo(cx + Math.cos(a+0.5)*r*0.7, cy + Math.sin(a+0.5)*r*0.7, cx + Math.cos(a+1)*r, cy + Math.sin(a+1)*r);
    cctx.stroke();
  }
}
function loop(t) { drawBG(t); drawCore(t); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
